[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loha"
version = "0.1.0.dev0"
description = "A next-gen application server for Python, currently in early development."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "grandimam" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/grandimam/loha"
Issues = "https://github.com/grandimam/loha/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/loha"]
